name: Welcome

# Posts a friendly comment when someone opens an issue or pull request.
# The workflow does not check out or execute contribution code.

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const isPR = context.eventName === 'pull_request_target';
            const payload = isPR ? context.payload.pull_request : context.payload.issue;
            const author = payload.user.login;
            const number = payload.number;

            if (author.endsWith('[bot]')) return;

            const body = isPR
              ? `Thanks for the pull request, @${author}. A maintainer will review it soon.\n\nPlease include the tests you ran and note any known limitations.`
              : `Thanks for opening this issue, @${author}. Please include what you expected, what actually happened, and concise reproduction steps.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body,
            });
