name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: uv sync --all-extras --frozen

      - name: Check generated agent instructions
        run: uv run --frozen python -m tools.skillgen --check

      - name: Run tests
        run: uv run --frozen pytest tests/ -q --tb=short

      - name: Verify CLI entry point
        run: uv run --frozen code2graph --help

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install project and audit tools
        run: uv sync --frozen

      - name: Static security analysis
        continue-on-error: true
        run: uv run --frozen bandit -r code2graph -ll

      - name: Dependency vulnerability audit
        continue-on-error: true
        run: uv run --frozen pip-audit --strict
